<!DOCTYPE html>

  <title>Ejemplo de JavaScript</title>
  <meta charset="UTF-8">

<body>
<script>
/* Visualizar array de objetos*/

let text = `{"alumnos":[
{"nombre":"Luis","nota":7},
{"nombre":"Ana","nota":8},
{"nombre":"Pedro","nota":9}]
}`;

const objeto_alumnos = JSON.parse(text);

function guardarAlumnos(objeto_alumnos){
  array_objetos_alumnos =[]
  for (let i=0; i<objeto_alumnos.alumnos.length;i++){
    array_objetos_alumnos.push(objeto_alumnos.alumnos[i]);
  }
  return array_objetos_alumnos
}

function mostrarAlumnos(array_objetos_alumnos){
  let texto ="";

  for (const key in array_objetos_alumnos){
    alert(array_objetos_alumnos[key].nombre+" - Nota: "+array_objetos_alumnos[key].nota);
  }
}
mostrarAlumnos(guardarAlumnos(objeto_alumnos))
